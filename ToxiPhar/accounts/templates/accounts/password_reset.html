<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogPhar – Reset Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        .logo { text-align: center; margin-bottom: 25px; }
        .logo h1 { color: #1a6b3c; font-size: 26px; }
        .logo p { color: #888; font-size: 13px; margin-top: 4px; }
        p.instructions { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        input {
            width: 100%; padding: 10px 14px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; outline: none;
        }
        input:focus { border-color: #1a6b3c; }
        .btn {
            width: 100%; padding: 12px; background: #1a6b3c; color: white;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
        }
        .btn:hover { background: #155c33; }
        .footer { text-align: center; margin-top: 20px; font-size: 13px; }
        .footer a { color: #1a6b3c; font-weight: 600; text-decoration: none; }

        /* Responsive adjustment for small phones */
        @media (max-width: 420px) {
            .card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>💊 LogPhar</h1>
            <p>Reset Your Password</p>
        </div>

        <p class="instructions">
            Enter the email address linked to your account, and we'll send you a link to reset your password.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn">Send Reset Link</button>
        </form>

        <div class="footer">
            <a href="{% url 'login' %}">← Back to Login</a>
        </div>
    </div>
</body>
</html>
