{% extends "base.html" %}
{% load static %}

{% block title %}ToxiPhar – Password changed{% endblock %}

{% block extra_css %}
<style>
  .confirm-card{
    max-width:400px;
    margin:0 auto;
    text-align:center;
  }
  .confirm-card .icon{
    font-size:2.6rem;
    margin-bottom:12px;
  }
  .confirm-card h1{
    color:var(--safe);
    font-size:1.3rem;
  }
  .confirm-card p{
    color:var(--muted);
    margin-bottom:var(--gap);
  }
  .confirm-card .btn{
    width:auto;
    padding:12px 24px;
  }
</style>
{% endblock %}

{% block content %}
<div class="card confirm-card">
  <div class="icon">✅</div>
  <h1>Password changed</h1>
  <p>Your password has been updated successfully.</p>
  <a href="{% url 'dashboard' %}" class="btn btn-primary">Back to dashboard</a>
</div>
{% endblock %}
