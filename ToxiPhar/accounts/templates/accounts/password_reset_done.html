<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogPhar – Check Your Email</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { color: #1a6b3c; font-size: 22px; margin-bottom: 12px; }
        p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .footer a { color: #1a6b3c; font-weight: 600; text-decoration: none; font-size: 14px; }

        /* Responsive adjustment for small phones */
        @media (max-width: 420px) {
            .card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📧</div>
        <h1>Check Your Email</h1>
        <p>
            If an account exists with that email, we've sent a link to reset your password.
            Please check your inbox (and spam folder).
        </p>
        <div class="footer">
            <a href="{% url 'login' %}">← Back to Login</a>
        </div>
    </div>
</body>
</html>
