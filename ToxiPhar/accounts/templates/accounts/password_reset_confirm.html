<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogPhar – Set New Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        .logo { text-align: center; margin-bottom: 25px; }
        .logo h1 { color: #1a6b3c; font-size: 26px; }
        .logo p { color: #888; font-size: 13px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        input {
            width: 100%; padding: 10px 14px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; outline: none;
        }
        input:focus { border-color: #1a6b3c; }
        .btn {
            width: 100%; padding: 12px; background: #1a6b3c; color: white;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
        }
        .btn:hover { background: #155c33; }
        .errors {
            background: #fff0f0; border: 1px solid #ffcccc; color: #cc0000;
            padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
        }
        .invalid {
            text-align: center; color: #cc0000; font-size: 14px; line-height: 1.6;
        }

        /* Responsive adjustment for small phones */
        @media (max-width: 420px) {
            .card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>💊 LogPhar</h1>
            <p>Set a New Password</p>
        </div>

        {% if validlink %}
            <form method="POST">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="errors">
                        Please correct the errors below.
                    </div>
                {% endif %}

                <div class="form-group">
                    <label>New Password</label>
                    {{ form.new_password1 }}
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    {{ form.new_password2 }}
                </div>
                <button type="submit" class="btn">Set New Password</button>
            </form>
        {% else %}
            <p class="invalid">
                This password reset link is invalid or has already been used.<br><br>
                Please request a new one.
            </p>
        {% endif %}
    </div>
</body>
</html>
